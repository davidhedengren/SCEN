.scen{
  --bg:#EDF0F5; --surface:#FFFFFF; --ink:#101C34; --muted:#5A6781; --line:#CAD2DF;
  --accent:var(--acc-l,#2F5BF5); --accent-2:#C47300; --hl:rgba(232,144,12,.32);
  --font:"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  position:relative; width:100%; height:100%; color:var(--ink); font-family:var(--font);
  -webkit-font-smoothing:antialiased; color-scheme:light;
}
.scen[data-look="dark"]{
  --bg:#0B1322; --surface:#131E35; --ink:#E7EDF7; --muted:#8E9AB3; --line:#26345A;
  --accent:var(--acc-d,#809EFF); --accent-2:#FFB547; --hl:rgba(255,181,71,.28); color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .scen[data-look="auto"]{
    --bg:#0B1322; --surface:#131E35; --ink:#E7EDF7; --muted:#8E9AB3; --line:#26345A;
    --accent:var(--acc-d,#809EFF); --accent-2:#FFB547; --hl:rgba(255,181,71,.28); color-scheme:dark;
  }
}
:root[data-theme="dark"] .scen[data-look="auto"]{
  --bg:#0B1322; --surface:#131E35; --ink:#E7EDF7; --muted:#8E9AB3; --line:#26345A;
  --accent:var(--acc-d,#809EFF); --accent-2:#FFB547; --hl:rgba(255,181,71,.28); color-scheme:dark;
}
.scen *,.scen *::before,.scen *::after{box-sizing:border-box}
.sc-viewport{position:absolute;inset:0;overflow:hidden;background:var(--bg);touch-action:pan-y}
.sc-bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.sc-stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,1));font-size:40px;line-height:1.4}
.sc-deck{position:absolute;inset:0}
.scen .slide{position:absolute;inset:0;padding:112px 144px;visibility:hidden;display:grid;align-content:start;gap:56px}
.scen .slide.active{visibility:visible}
.scen .slide h1,.scen .slide h2,.scen .slide h3,.scen .slide p,.scen .slide ul,.scen .slide ol,.scen .slide figure,.scen .slide table{margin:0}
.scen .slide h2{font-size:80px;line-height:1.04;font-weight:650;letter-spacing:-.03em;text-wrap:balance}
.scen .slide h3{font-size:44px;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.scen .slide ul,.scen .slide ol{padding:0;list-style:none}
.scen .lead{font-size:44px;line-height:1.3;color:var(--muted);max-width:34ch;text-wrap:pretty}
.scen mark{color:inherit;background:linear-gradient(var(--hl),var(--hl)) no-repeat 0 88%/100% 38%}
.scen sup,.scen sub{font-size:.62em;line-height:0}
.scen .w{display:inline-block;white-space:pre}
.scen .typing::after{content:"";display:inline-block;width:.07em;height:.85em;margin-left:.06em;background:var(--accent);vertical-align:-.06em}
.sc-counter{position:absolute;right:144px;bottom:56px;font-size:24px;color:var(--muted);font-variant-numeric:tabular-nums}
.sc-progress{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);transition:transform .6s cubic-bezier(.16,1,.3,1)}
.scen.preview .sc-counter,.scen.preview .sc-progress,.scen.static .sc-counter,.scen.static .sc-progress{display:none}
.scen:not(.static) .slide [data-step]:not(.in){opacity:0;pointer-events:none}
.scen [data-dim]>*{transition:opacity .45s ease}
.scen .slide .dimmed{opacity:.32}

/* ---------- Layouter ---------- */
.scen [data-layout="title"]{align-content:end;gap:36px}
.scen [data-layout="title"] h1{font-size:220px;line-height:.9;font-weight:700;letter-spacing:-.05em;justify-self:start;text-wrap:balance;max-width:14ch}
.scen [data-layout="title"] h1.long{font-size:140px;max-width:18ch}
.scen [data-layout="title"] .by{font-size:30px;color:var(--muted);margin-top:28px}

.scen [data-layout="section"]{align-content:center;gap:28px}
.scen [data-layout="section"] .part{font-size:36px;color:var(--accent);font-weight:600}
.scen [data-layout="section"] h2{font-size:168px;line-height:.95;letter-spacing:-.05em;max-width:13ch}

.scen [data-layout="statement"]{align-content:center;gap:48px}
.scen [data-layout="statement"] h2{font-size:108px;line-height:1.03;letter-spacing:-.035em;max-width:18ch}

.scen [data-layout="bullets"]{align-content:start;grid-template-rows:auto auto 1fr}
.scen .points{align-self:center;max-width:1500px}
.scen .points li{padding:22px 0 22px 0;border-top:1px solid var(--line);font-size:42px;line-height:1.3}
.scen .points li.sub{padding-left:64px;font-size:36px;color:var(--muted);border-top-style:dashed}
.scen .points.dense li{font-size:34px;padding:14px 0}
.scen .points.dense li.sub{font-size:30px}

.scen [data-layout="split"]{grid-template-columns:5fr 6fr;column-gap:112px;align-items:center;align-content:stretch}
.scen [data-layout="split"].flip{grid-template-columns:6fr 5fr}
.scen [data-layout="split"].flip .fig{order:-1}
.scen .text{display:grid;gap:44px;align-content:center;min-width:0}
.scen .text .points li{font-size:38px}
.scen .fig{display:grid;place-items:center;min-width:0;min-height:0;height:100%;max-height:856px}
.scen .fig img{max-width:100%;max-height:856px;object-fit:contain;border-radius:var(--radius,20px);display:block}
.scen .ph{width:100%;aspect-ratio:4/3;border:3px dashed var(--line);border-radius:24px;display:grid;place-items:center;color:var(--muted);font-size:30px}

.scen [data-layout="image"]{padding:72px 96px;grid-template-rows:1fr auto;gap:28px}
.scen [data-layout="image"] .fig{max-height:none}
.scen [data-layout="image"] .fig img{max-height:820px}
.scen [data-layout="image"] .cap{display:flex;gap:36px;align-items:baseline;justify-content:space-between}
.scen [data-layout="image"] .cap h2{font-size:52px}
.scen [data-layout="image"] .cap p{font-size:28px;color:var(--muted)}

.scen [data-layout="compare"]{grid-template-rows:auto 1fr}
.scen .cols{display:grid;grid-template-columns:1fr 1fr;align-content:center}
.scen .cols>div{display:grid;gap:28px;align-content:start;padding:0 88px}
.scen .cols>div:first-child{padding-left:0}
.scen .cols>div+div{border-left:2px solid var(--line)}
.scen .cols h3{color:var(--accent)}
.scen .cols li{font-size:40px;padding:12px 0}

.scen [data-layout="table"]{grid-template-rows:auto 1fr}
.scen .tbl-wrap{align-self:center;justify-self:start;max-width:100%}
.scen .slide table{border-collapse:collapse;font-size:38px;font-variant-numeric:tabular-nums}
.scen .slide td,.scen .slide th{padding:18px 48px 18px 0;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.scen .slide th{font-size:30px;font-weight:600;color:var(--muted);border-bottom:2px solid var(--ink)}
.scen .slide table.dense{font-size:28px}
.scen .slide table.dense td,.scen .slide table.dense th{padding:10px 36px 10px 0}
.scen .slide td.ans{color:var(--accent);font-weight:600}

.scen [data-layout="number"]{align-content:center;gap:32px}
.scen [data-layout="number"] .label{font-size:40px;color:var(--accent);font-weight:600}
.scen .big{font-size:260px;line-height:.9;font-weight:700;letter-spacing:-.045em;font-variant-numeric:tabular-nums;white-space:nowrap}
.scen .unit{font-size:48px;line-height:1.3;color:var(--muted);max-width:30ch}

.scen [data-layout="timeline"]{grid-template-rows:auto 1fr}
.scen .track{position:relative;align-self:center}
.scen .rail{position:absolute;left:0;right:0;top:12px;height:3px;background:var(--line)}
.scen .track ol{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:36px}
.scen .track li{position:relative;padding-top:72px;display:grid;gap:14px;align-content:start}
.scen .track li::before{content:"";position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:50%;background:var(--bg);border:4px solid var(--accent)}
.scen .track b{font-size:60px;line-height:1;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.scen .track span{font-size:30px;line-height:1.35;color:var(--muted)}

.scen [data-layout="question"]{align-content:center;gap:52px}
.scen [data-layout="question"] h2{font-size:84px;max-width:22ch}
.scen .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:24px}
.scen .opts li{font-size:38px;padding:24px 32px;border:2px solid var(--line);border-radius:var(--radius,20px);display:flex;gap:24px;align-items:baseline;background:var(--surface)}
.scen .opts li b{color:var(--accent)}
.scen .answer{font-size:46px;line-height:1.3;padding:32px 40px;border-radius:var(--radius,24px);background:var(--surface);border-left:10px solid var(--accent);max-width:1500px}
.scen .answer b{color:var(--accent);margin-right:.4em}

.scen [data-layout="quote"]{align-content:center;gap:48px}
.scen [data-layout="quote"] blockquote{margin:0;font-size:84px;line-height:1.12;letter-spacing:-.025em;font-weight:600;max-width:22ch;text-wrap:balance}
.scen [data-layout="quote"] blockquote::before{content:"\201D";display:block;font-size:200px;line-height:.6;color:var(--accent);height:90px}
.scen [data-layout="quote"] .by{font-size:36px;color:var(--muted)}


/* ---------- kort, kantbild och bildband ---------- */
.scen .part{font-size:36px;color:var(--accent);font-weight:600}
.scen [data-layout="statement"] h2.long{font-size:80px;max-width:24ch}
.scen [data-layout="cards"]{grid-template-rows:auto auto 1fr}
.scen .cards{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:36px;align-self:center;align-content:center}
.scen .cards li{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius,28px);padding:40px 44px;display:grid;gap:14px;align-content:start}
.scen .cards h3{color:var(--accent);font-size:44px}
.scen .cards p{font-size:32px;line-height:1.38;color:var(--muted)}
.scen [data-layout="cards"].side{grid-template-columns:minmax(0,1fr) 640px;column-gap:96px;grid-template-rows:auto auto 1fr;align-content:stretch}
.scen [data-layout="cards"].side>*{grid-column:1}
.scen [data-layout="cards"].side>.fig{grid-column:2;grid-row:1/-1}
.scen [data-layout="cards"].side.flip{grid-template-columns:640px minmax(0,1fr)}
.scen [data-layout="cards"].side.flip>*{grid-column:2}
.scen [data-layout="cards"].side.flip>.fig{grid-column:1}
.scen .side .cards{gap:20px;align-self:start}
.scen .side .cards li{grid-template-columns:320px 1fr;gap:28px;align-items:baseline;padding:28px 36px;border-radius:var(--radius,22px)}
.scen .side .cards h3{font-size:36px}
.scen [data-layout="cards"].side h2{font-size:68px}
.scen .side .cards.dense li{padding:20px 30px}
.scen .side .cards.dense p{font-size:28px}
.scen .side .fig img{width:100%;height:100%;max-height:856px;object-fit:cover;border-radius:var(--radius,28px)}
.scen .slide.withimg{padding-right:872px}
.scen .withimg[data-layout="title"] h1{font-size:128px;max-width:none}
.scen .withimg[data-layout="title"] h1.long{font-size:104px}
.scen .withimg[data-layout="statement"] h2{font-size:84px;max-width:none}
.scen .withimg[data-layout="statement"] h2.long{font-size:64px}
.scen .withimg[data-layout="section"] h2{font-size:120px;max-width:none}
.scen .bleed{position:absolute;top:0;right:0;bottom:0;width:760px;margin:0}
.scen .bleed img{width:100%;height:100%;object-fit:cover;display:block}
.scen .bleed::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0,transparent 22%)}
.scen .slide.hasbanner{padding-top:344px;gap:40px}
.scen .banner{position:absolute;left:0;right:0;top:0;height:296px;margin:0}
.scen .banner img{width:100%;height:100%;object-fit:cover;display:block}
.scen .banner::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0,transparent 45%)}
.scen .hasbanner .cards li{padding:32px 40px}

.scen [data-layout="cards"] .lead,.scen [data-layout="compare"] .lead,.scen .hasbanner .lead{max-width:62ch;font-size:36px}
.scen .text .lead{font-size:34px}
.scen .slide table.xdense{font-size:24px}
.scen .slide table.xdense td,.scen .slide table.xdense th{padding:9px 26px 9px 0}
.scen .slide table.xdense th{font-size:22px}
.scen .slide td:first-child{font-weight:600}

/* ---------- tema: typsnitt och ornament ---------- */
.scen{font-family:var(--font,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif)}
.scen .slide h1,.scen .slide h2,.scen .slide h3,.scen .big,.scen blockquote,.scen .track b,.scen .timer .tt{font-family:var(--font-display,var(--font));text-transform:var(--h-case,none)}
.scen .slide h1,.scen .slide h2,.scen .big,.scen blockquote,.scen .track b{letter-spacing:var(--h-track,-.03em)}
.scen .slide h2,.scen blockquote{font-weight:var(--h-weight,650)}
.scen .slide h1,.scen .big,.scen .track b{font-weight:var(--h-weight,700)}
.scen[data-orn="line"] .slide h2::before,.scen[data-orn="line"] .slide h1::before{content:"";display:block;width:88px;height:4px;background:var(--accent);margin-bottom:.4em}
.scen[data-orn="square"] .slide h2::before{content:"";display:inline-block;width:.3em;height:.3em;background:var(--accent);margin-right:.3em;vertical-align:.1em}
.scen[data-orn="line"] .cap h2::before,.scen[data-orn="square"] .cap h2::before{display:none}

/* ---------- omröstning ---------- */
.scen [data-layout="poll"]{align-content:center;gap:40px}
.scen .poll{display:grid;gap:18px;max-width:1520px;margin:0;padding:0;list-style:none}
.scen .poll li{position:relative;display:grid;grid-template-columns:56px 1fr 120px;align-items:center;gap:24px;padding:22px 32px;border:2px solid var(--line);border-radius:var(--radius,20px);background:var(--surface);overflow:hidden;font-size:38px;line-height:1.25;transition:opacity .4s,border-color .4s,box-shadow .4s}
.scen.present .poll li{cursor:pointer}
.scen .poll li b{color:var(--accent);font-size:40px}
.scen .poll .pbar{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,0) * 100%);background:var(--hl);transition:width .7s cubic-bezier(.16,1,.3,1)}
.scen .poll li>b,.scen .poll li>.t,.scen .poll li>.n{position:relative;z-index:1}
.scen .poll .n{justify-self:end;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.scen .poll-hint{font-size:24px;color:var(--muted);margin:0}
.scen.static .poll-hint{display:none}
.scen .poll-reveal{font-size:38px;margin:0}
.scen .poll-reveal b{color:var(--accent)}
.scen .slide:has(.poll-reveal.in) .poll li.correct,.scen.static .poll li.correct{border-color:var(--accent);box-shadow:0 0 0 4px var(--hl)}
.scen .slide:has(.poll-reveal.in) .poll li:not(.correct){opacity:.45}

/* ---------- reflektion med timer ---------- */
.scen [data-layout="reflect"]{align-content:center;gap:36px;padding-right:640px}
.scen [data-layout="reflect"] h2{font-size:92px;line-height:1.05}
.scen .tps{display:flex;flex-wrap:wrap;gap:16px 44px;font-size:34px;color:var(--muted);margin:0;padding:0;list-style:none}
.scen .tps b{color:var(--accent);margin-right:12px}
.scen .timer{position:absolute;right:144px;top:50%;width:400px;height:400px;margin-top:-200px;display:grid;place-items:center}
.scen .timer svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.scen .timer circle{fill:none;stroke-width:6}
.scen .timer .trk{stroke:var(--line)}
.scen .timer .arc{stroke:var(--accent);stroke-dasharray:100;stroke-dashoffset:0;stroke-linecap:round}
.scen .timer .tt{font-size:104px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.scen .timer.done .tt{color:var(--accent);animation:sc-pulse 1s ease-in-out 3}
.scen:not(.static) .slide .timer[data-step]:not(.in){opacity:.3;pointer-events:none}
.scen:not(.static) .slide .timer[data-step]:not(.in)::after{content:"Klicka för att starta";position:absolute;bottom:-56px;font-size:26px;color:var(--muted);white-space:nowrap}
@keyframes sc-pulse{50%{opacity:.3}}

/* ---------- definition ---------- */
.scen [data-layout="define"]{align-content:center;gap:40px}
.scen .slide h1.term{font-size:190px;line-height:.95;margin:0}
.scen .def{font-size:54px;line-height:1.28;max-width:32ch;margin:0}
.scen .ex{font-size:36px;line-height:1.4;color:var(--muted);max-width:62ch;margin:0;background:var(--surface);padding:28px 36px;border-radius:var(--radius,22px)}
.scen .ex b{display:block;color:var(--accent);font-size:24px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}

/* ---------- AI-samtal ---------- */
.scen [data-layout="chat"]{grid-template-rows:auto 1fr}
.scen .chat{display:flex;flex-direction:column;gap:22px;width:100%;max-width:1440px;justify-self:center;align-self:center;margin:0;padding:0;list-style:none}
.scen .msg{max-width:76%;padding:22px 32px;border-radius:var(--radius,24px);font-size:34px;line-height:1.4;display:grid;gap:4px}
.scen .msg .who{font-size:21px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.scen .msg p{margin:0}
.scen .msg.me{align-self:flex-end;background:var(--accent);color:var(--bg)}
.scen .msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.scen .chat:has(> li:nth-child(5)) .msg{font-size:28px;padding:16px 26px}

/* ---------- två tal ---------- */
.scen [data-layout="duo"]{grid-template-rows:auto 1fr auto}
.scen .duo{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));align-self:center}
.scen .duo>div{display:grid;gap:22px;padding:0 72px;align-content:start}
.scen .duo>div:first-child{padding-left:0}
.scen .duo>div+div{border-left:2px solid var(--line)}
.scen .duo .big{font-size:190px;color:var(--accent);margin:0}
.scen .duo .unit{font-size:40px;margin:0}
.scen [data-layout="duo"] .lead{max-width:60ch;font-size:36px}

/* ---------- Atlas-familjen (efter Slidecraft, MIT) ---------- */
.scen .slide h1,.scen .slide h2,.scen blockquote,.scen .map b,.scen .landing{font-style:var(--h-style,normal)}
.scen .kicker{font-family:var(--font-mono,ui-monospace,Menlo,monospace);font-size:24px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin:0}
.scen .slide h2.small{font-size:56px}
/* omslag */
.scen [data-layout="omslag"]{padding:0;display:grid;grid-template-columns:minmax(0,1fr);align-content:stretch;overflow:hidden}
.scen [data-layout="omslag"].hasimg{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr)}
.scen .om-text{position:relative;z-index:2;padding:120px 96px 120px 144px;display:grid;align-content:center;gap:36px}
.scen .om-rule{width:84px;height:3px;background:var(--accent);transform-origin:0 50%}
.scen .slide h1.om-title{margin:0;line-height:.94;letter-spacing:var(--h-track,-.03em)}
.scen .om-title.t-s{font-size:230px}.scen .om-title.t-m{font-size:156px}.scen .om-title.t-l{font-size:112px}
.scen .hasimg .om-title.t-s{font-size:200px}.scen .hasimg .om-title.t-m{font-size:140px}.scen .hasimg .om-title.t-l{font-size:112px}
.scen .om-body{font-size:40px;line-height:1.35;color:var(--muted);max-width:32ch;margin:0}

.sc-notes{position:absolute;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:18px 28px calc(18px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr auto;gap:8px 32px;max-height:40%;overflow:auto;font-size:18px;line-height:1.5}
.sc-notes .n-body{white-space:pre-wrap}
.sc-notes .n-meta{color:var(--muted);font-size:15px;text-align:right;font-variant-numeric:tabular-nums;display:grid;gap:4px;align-content:start}
.sc-notes .n-timer{font-size:26px;font-weight:650;color:var(--ink)}
.sc-help{position:absolute;inset:0;z-index:25;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 88%,transparent);padding:24px}
.sc-help .panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 32px;max-width:520px;display:grid;gap:18px;font-size:16px}
.sc-help h2{margin:0;font-size:22px}
.sc-keys{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;margin:0}
.sc-keys dt{justify-self:end;white-space:nowrap}
.sc-keys dd{margin:0;color:var(--muted)}
.scen kbd{font-family:var(--font);font-size:.85em;min-width:1.9em;display:inline-block;text-align:center;padding:.08em .45em;border:1px solid var(--line);border-bottom-width:3px;border-radius:7px;background:var(--bg);color:var(--ink)}
.sc-black{position:absolute;inset:0;background:#000;z-index:30;opacity:0;pointer-events:none;transition:opacity .4s}
.sc-black.on{opacity:1;pointer-events:auto}
.sc-toast{position:absolute;left:50%;bottom:28px;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;z-index:40;pointer-events:none;transition:opacity .3s,transform .3s;max-width:90%}
.sc-toast.on{opacity:1;transform:translate(-50%,0)}
.sc-bar{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:12;display:flex;gap:8px;opacity:0;transition:opacity .3s}
.scen.present:hover .sc-bar,.sc-bar:focus-within,.scen.touch .sc-bar{opacity:1}
.scen.idle .sc-bar{opacity:0}
.scen.idle .sc-viewport{cursor:none}
.sc-bar button{font:500 14px/1 var(--font);padding:9px 13px;border-radius:9px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--ink);cursor:pointer}
.sc-bar button:focus-visible,.sc-help button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.sc-progress,.sc-black,.sc-toast,.scen .gs-needle,.scen .gs-prog,.scen .br-comet,.scen .ln-lens,.scen .ln-ring{transition:none}.scen .om-ring{animation:none}}
/* ---------- Ljusfamiljen: mörkt, stora ytor, ljus i stället för linjer ---------- */
.scen[data-glow="1"] .sc-viewport,.scen.sc-thumb[data-glow="1"]{background:radial-gradient(1100px 760px at 12% 8%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 70%),radial-gradient(1200px 900px at 92% 96%,color-mix(in srgb,var(--accent-2) 10%,transparent),transparent 70%),var(--bg)}
.scen[data-glow="1"] .slide h1,.scen[data-glow="1"] .slide h2{font-family:var(--font-display,var(--font));font-weight:var(--h-weight,700);letter-spacing:var(--h-track,-.04em)}
.scen .lj-kick{font-size:26px;font-weight:600;letter-spacing:.02em;color:var(--accent);margin:0}
.scen .slide[class*="lj-"] h2{font-family:var(--font-display,var(--font));font-weight:var(--h-weight,700);font-style:var(--h-style,normal);letter-spacing:var(--h-track,-.04em);line-height:.98}
.scen .slide[class*="lj-"] .lead{color:var(--muted);font-size:38px;line-height:1.38;max-width:30ch}
@keyframes lj-push{from{transform:scale(1.02)}to{transform:scale(1.14) translate(-1.5%,-1%)}}
@keyframes lj-pan{from{background-position:30% 40%}to{background-position:70% 60%}}

/* Ridå */
.scen .lj-rida{padding:0;display:block;overflow:hidden}
.scen .rd-img{position:absolute;inset:0;margin:0}
.scen .rd-img img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:62% 40%}
.scen:not(.static) .slide.active .rd-img img{animation:lj-push 22s cubic-bezier(.2,.6,.3,1) both}
.scen .rd-veil{position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--bg) 94%,transparent) 0%,color-mix(in srgb,var(--bg) 72%,transparent) 38%,color-mix(in srgb,var(--bg) 8%,transparent) 78%),linear-gradient(0deg,var(--bg) 0%,transparent 46%)}
.scen .rd-cur{position:absolute;top:0;bottom:0;width:50.5%;background:var(--bg);z-index:3;transform:translateX(-101%);opacity:0}
.scen .rd-cur.l{left:0;box-shadow:inset -10px 0 0 var(--accent),30px 0 120px 20px color-mix(in srgb,var(--accent) 45%,transparent)}
.scen .rd-cur.r{right:0;transform:translateX(101%);box-shadow:inset 10px 0 0 var(--accent),-30px 0 120px 20px color-mix(in srgb,var(--accent) 45%,transparent)}
.scen .rd-text{position:absolute;left:144px;right:144px;bottom:120px;display:grid;gap:34px;z-index:2}
.scen .lj-rida h1{font-family:var(--font-display,var(--font));font-weight:var(--h-weight,700);letter-spacing:var(--h-track,-.045em);line-height:.93;max-width:14ch;text-wrap:balance}
.scen .lj-rida.r-s h1{font-size:220px}
.scen .lj-rida.r-m h1{font-size:140px;max-width:15ch}
.scen .lj-rida.r-l h1{font-size:96px;max-width:22ch;line-height:1}
.scen .lj-rida .lead{max-width:40ch}
.scen .lj-rida h1 mark{background:none;color:var(--accent)}

/* Strålkastare */
.scen .lj-sp{align-content:center;gap:52px;overflow:hidden}
.scen .sp-beam{position:absolute;left:-6%;top:-38%;width:1300px;height:1500px;pointer-events:none}
.scen .sp-beam::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 50% 60% at 50% 12%,color-mix(in srgb,var(--accent) 34%,transparent),transparent 72%);transform:rotate(-28deg);filter:blur(30px)}
.scen .sp-text{position:relative;font-family:var(--font-display,var(--font));font-weight:var(--h-weight,700);letter-spacing:var(--h-track,-.04em);line-height:1.06;max-width:17ch;text-wrap:balance}
.scen .lj-sp.p-s .sp-text{font-size:150px}
.scen .lj-sp.p-m .sp-text{font-size:118px;max-width:19ch}
.scen .lj-sp.p-l .sp-text{font-size:86px;max-width:24ch}
.scen .sp-p{color:color-mix(in srgb,var(--ink) 16%,transparent);transition:color .8s cubic-bezier(.2,.8,.2,1),background-size 1s cubic-bezier(.65,0,.25,1);background:linear-gradient(color-mix(in srgb,var(--accent) 34%,transparent),color-mix(in srgb,var(--accent) 34%,transparent)) no-repeat 0 86%/0% 30%;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.scen:not(.static) .slide .sp-p[data-step]:not(.in){opacity:1;pointer-events:auto}
.scen .sp-p.in,.scen .lj-sp.nosteps .sp-p,.scen.static .sp-p{color:var(--ink)}
.scen .sp-p.in:not(:has(~ .sp-p.in)),.scen.static .sp-p:last-child,.scen .lj-sp.nosteps .sp-p:last-child{background-size:100% 30%}
.scen .sp-foot{position:relative;font-size:38px;line-height:1.4;color:var(--muted);max-width:40ch}

/* Fokus */
.scen .lj-fk{grid-template-columns:600px 1fr;gap:110px;align-content:center;align-items:center}
.scen .fk-side{display:grid;gap:30px;align-content:start}
.scen .lj-fk .fk-side h2{font-size:84px}
.scen .lj-fk .fk-side .lead{font-size:34px}
.scen .fk-list{display:grid;gap:6px;counter-reset:fk}
.scen .fk-i{display:grid;transition:opacity .6s}
.scen .fk-i b{font-family:var(--font-display,var(--font));font-weight:var(--h-weight,700);letter-spacing:var(--h-track,-.04em);font-size:92px;line-height:1.08;color:color-mix(in srgb,var(--ink) 18%,transparent);transition:color .7s,filter .7s,transform .8s cubic-bezier(.2,.8,.2,1);transform-origin:0 50%;filter:blur(1.5px)}
.scen .lj-fk.many .fk-i b{font-size:60px}
.scen .lj-fk.many{grid-template-columns:520px 1fr;gap:96px}
.scen .fk-d{display:grid;grid-template-rows:0fr;transition:grid-template-rows .8s cubic-bezier(.2,.8,.2,1),opacity .6s;opacity:0}
.scen .fk-d>p{overflow:hidden;font-size:34px;line-height:1.4;color:var(--muted);max-width:36ch}
.scen .fk-d>p::before{content:"";display:block;height:14px}
.scen .fk-d>p::after{content:"";display:block;height:22px}
.scen:not(.static) .slide .fk-i[data-step]:not(.in){opacity:1;pointer-events:auto}
.scen .fk-i.in b{color:color-mix(in srgb,var(--ink) 38%,transparent);filter:none}
.scen .fk-i.in:not(:has(~ .fk-i.in)) b,.scen.static .fk-i:last-child b,.scen .lj-fk.nosteps .fk-i b{color:var(--ink);filter:none;background:linear-gradient(95deg,var(--ink) 30%,var(--accent) 110%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.scen .fk-i.in:not(:has(~ .fk-i.in)) .fk-d,.scen.static .fk-i:last-child .fk-d,.scen .lj-fk.nosteps .fk-d{grid-template-rows:1fr;opacity:1}
.scen .lj-fk.nosteps .fk-i b{font-size:60px}

/* Ordbild */
.scen .lj-ob{align-content:center;justify-items:center;text-align:center;gap:40px;overflow:hidden}
.scen .ob-amb{position:absolute;inset:-80px;background-size:cover;background-position:center;filter:blur(60px) saturate(1.3);opacity:.34}
.scen .ob-amb::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 20%,var(--bg) 78%)}
.scen .lj-ob .lj-kick,.scen .lj-ob .lead{position:relative}
.scen .lj-ob .lead{max-width:36ch;text-align:center}
.scen .ob-word{position:relative;font-family:var(--font-display,var(--font));font-weight:var(--h-weight,700);letter-spacing:-.06em;line-height:.86;padding:0 .06em .06em;text-wrap:balance}
.scen .lj-ob.o-s .ob-word{font-size:420px}
.scen .lj-ob.o-m .ob-word{font-size:300px}
.scen .lj-ob.o-l .ob-word{font-size:210px}
.scen .lj-ob.o-xl .ob-word{font-size:150px;max-width:12ch}
.scen .ob-word.filled{background-size:cover;background-position:50% 50%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.scen:not(.static) .slide.active .ob-word.filled{animation:lj-pan 16s ease-in-out infinite alternate}

/* Bildfält */
.scen .lj-bf{padding:0;display:block;overflow:hidden}
.scen .bf-img{position:absolute;top:0;bottom:0;right:0;width:64%;margin:0;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 38%);mask-image:linear-gradient(90deg,transparent 0%,#000 38%)}
.scen .lj-bf.flip .bf-img{right:auto;left:0;-webkit-mask-image:linear-gradient(270deg,transparent 0%,#000 38%);mask-image:linear-gradient(270deg,transparent 0%,#000 38%)}
.scen .bf-img img{width:100%;height:100%;object-fit:cover;display:block}
.scen:not(.static) .slide.active .bf-img img{animation:lj-push 24s cubic-bezier(.2,.6,.3,1) both}
.scen .bf-text{position:absolute;left:144px;top:0;bottom:0;width:860px;display:grid;align-content:center;gap:34px;z-index:1}
.scen .lj-bf.flip .bf-text{left:auto;right:144px}
.scen .lj-bf.noimg .bf-text{width:1300px}
.scen .lj-bf h2{font-size:92px}
.scen .bf-list{display:grid;gap:22px;margin-top:10px}
.scen .bf-list li{font-size:36px;line-height:1.35;padding-left:44px;position:relative;max-width:32ch}
.scen .bf-list li::before{content:"";position:absolute;left:0;top:.52em;width:22px;height:8px;border-radius:4px;background:var(--accent)}
.scen .bf-list li mark{background:none;color:var(--ink);font-weight:600}

/* Delning */
.scen .lj-dl{padding:0;display:grid;grid-template-rows:auto 1fr;gap:0}
.scen .dl-head{display:grid;grid-template-columns:1fr 640px;gap:80px;align-items:end;padding:96px 144px 64px}
.scen .dl-head>div{display:grid;gap:22px}
.scen .lj-dl h2{font-size:84px}
.scen .dl-ex{font-size:30px;line-height:1.42;color:var(--muted)}
.scen .dl-ex b{color:var(--ink);font-weight:600}
.scen .dl-fields{display:grid;grid-template-columns:1fr 1fr;min-height:0}
.scen .dl-f{display:grid;align-content:end;gap:26px;padding:80px 144px 110px}
.scen .dl-f h3{font-family:var(--font-display,var(--font));font-weight:var(--h-weight,700);letter-spacing:var(--h-track,-.04em);font-size:104px;line-height:.95}
.scen .dl-f p{font-size:36px;line-height:1.4;max-width:24ch}
.scen .dl-f.a{background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 50%,transparent),var(--surface))}
.scen .dl-f.a p{color:var(--muted)}
.scen .dl-f.b{background:radial-gradient(900px 700px at 80% 100%,var(--accent-2),transparent 70%),linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--accent-2)));color:#0B0C10}
.scen .dl-f.b p{color:rgba(11,12,16,.8)}
.scen .dl-f.b mark{background:rgba(11,12,16,.12)}

/* Ljustal */
.scen .lj-lt{grid-template-columns:1fr 640px;gap:90px;align-content:center;align-items:center;overflow:hidden}
.scen .lt-glow{position:absolute;left:-200px;top:40px;width:1400px;height:1000px;pointer-events:none;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 36%,transparent),transparent);filter:blur(20px)}
.scen .lt-num{position:relative;display:grid;gap:44px}
.scen .lt-big{font-family:var(--font-display,var(--font));font-weight:var(--h-weight,700);letter-spacing:-.06em;line-height:.85;font-variant-numeric:tabular-nums;white-space:nowrap;background:linear-gradient(170deg,var(--ink) 35%,var(--accent) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-bottom:.04em}
.scen .lj-lt.n-s .lt-big{font-size:400px}
.scen .lj-lt.n-m .lt-big{font-size:280px}
.scen .lj-lt.n-l .lt-big{font-size:190px}
.scen .lt-bar{height:28px;border-radius:14px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden;max-width:980px}
.scen .lt-bar i{display:block;height:100%;border-radius:14px;background:linear-gradient(90deg,var(--accent-2),var(--accent));transform-origin:0 50%;box-shadow:0 0 40px color-mix(in srgb,var(--accent) 60%,transparent)}
.scen .lt-text{position:relative;display:grid;gap:30px}
.scen .lj-lt .lt-text h2{font-size:76px}

/* Djup: inga ramar, inga siffercirklar i de äldre mallarna */
.scen[data-theme-id="djup"] .cards li,.scen[data-theme-id="djup"] .map li,.scen[data-theme-id="djup"] .duel .side,.scen[data-theme-id="djup"] .opts li,.scen[data-theme-id="djup"] .poll li,.scen[data-theme-id="djup"] .msg.ai{border-color:transparent;background:linear-gradient(160deg,color-mix(in srgb,var(--ink) 7%,transparent),color-mix(in srgb,var(--ink) 2%,transparent))}
.scen[data-theme-id="djup"] .map li::before,.scen[data-theme-id="djup"] .triad li::before{display:none}
.scen[data-theme-id="djup"] .map li{padding-top:48px}
.scen[data-theme-id="djup"] .track li::before{border:0;background:var(--accent);border-radius:6px;width:28px;height:10px;top:10px}
.scen[data-theme-id="djup"] .kicker{font-family:var(--font);letter-spacing:.02em;text-transform:none;font-weight:600;font-size:26px;color:var(--accent)}
@media (prefers-reduced-motion:reduce){.scen .slide .rd-img img,.scen .slide .bf-img img,.scen .slide .ob-word.filled{animation:none!important}.scen .sp-p,.scen .fk-i b,.scen .fk-d{transition:none}}
.scen[data-look="light"] .dl-f.b{color:#fff}.scen[data-look="light"] .dl-f.b p{color:rgba(255,255,255,.88)}.scen[data-look="light"] .dl-f.b mark{background:rgba(255,255,255,.2)}

/* Signaturmallar: egna kompositioner, gemensamma temafärger. */
.scen .sig-kicker,.scen .sig-index{font:20px var(--mono,monospace);letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.scen [data-layout="lameller"]{padding:0;isolation:isolate;display:flex;align-items:flex-end}
.scen [data-layout="lameller"] .sig-picture{position:absolute;inset:0;background:linear-gradient(135deg,var(--surface),var(--hl),var(--bg));z-index:-3;overflow:hidden}
.scen [data-layout="lameller"] .sig-picture img{width:100%;height:100%;object-fit:cover;opacity:.35}
.scen [data-layout="lameller"] .sig-picture:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,var(--bg),transparent)}
.scen [data-layout="lameller"] .sig-slats{position:absolute;inset:0;display:flex;z-index:-1;overflow:hidden;pointer-events:none}
.scen [data-layout="lameller"] .sig-slats i{flex:1;background:var(--bg);transform:translateY(102%);border-right:1px solid var(--line)}
.scen [data-layout="lameller"] .sig-slats i:nth-child(even){transform:translateY(-102%)}
.scen [data-layout="lameller"] .sig-cover{align-self:end;padding:112px 144px;max-width:1500px}
.scen [data-layout="lameller"] h2{font-size:150px;line-height:1.02;margin:38px 0}
.scen [data-layout="lameller"] .lead{max-width:1000px}
.scen [data-layout="register"],.scen [data-layout="samband"],.scen [data-layout="marginal"],.scen [data-layout="sats"]{grid-template-rows:auto 1fr;align-content:stretch;gap:62px}
.scen [data-layout="register"] .sig-register{display:flex;gap:0;min-height:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.scen [data-layout="register"] .sig-panel{position:relative;flex:1;min-width:0;padding:48px 32px;overflow:hidden;border-right:1px solid var(--line);transition:flex 1000ms cubic-bezier(.16,1,.3,1),background 800ms,opacity 500ms;opacity:1!important}
.scen [data-layout="register"] .sig-panel:last-child{border-right:0}
.scen [data-layout="register"] h3{font-size:42px;margin-top:64px;overflow-wrap:anywhere}
.scen [data-layout="register"] .sig-panel p{font-size:34px;margin-top:32px;line-height:1.4;opacity:0;transform:translateY(20px);transition:opacity 550ms 200ms,transform 800ms}
.scen [data-layout="register"] .sig-tick{position:absolute;bottom:42px;font-size:55px;color:var(--accent)}
.scen:not(.static) [data-layout="register"] .sig-panel.in:not(:has(~ .in)){flex:3;background:var(--surface)}
.scen [data-layout="register"] .sig-panel.in:not(:has(~ .in)) p,.scen.static [data-layout="register"] .sig-panel p,.scen [data-layout="register"] .sig-panel[data-open] p{opacity:1;transform:none}
.scen [data-layout="samband"] .sig-network{display:grid;grid-template-columns:1fr 1fr;gap:240px;align-items:center}
.scen [data-layout="samband"] .sig-premises{display:flex;flex-direction:column;gap:34px}
.scen [data-layout="samband"] article{position:relative;padding:20px 0;border-top:1px solid var(--line)}
.scen [data-layout="samband"] h3{font-size:38px;margin:12px 0}
.scen [data-layout="samband"] article p{font-size:28px;color:var(--muted)}
.scen [data-layout="samband"] svg{position:absolute;left:100%;top:0;width:240px;height:100%;overflow:visible}
.scen .sig-network path,.scen .sig-notes path{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:0}
.scen [data-layout="samband"] .sig-result{padding:56px 0 56px 48px;border-left:2px solid var(--accent)}
.scen [data-layout="samband"] .sig-result p{font:64px/1.12 var(--font-display,var(--font));margin-top:32px}
.scen [data-layout="marginal"] .sig-editorial{display:grid;grid-template-columns:1.5fr 1fr;gap:96px;min-height:0}
.scen [data-layout="marginal"] figure{margin:0;min-height:0;overflow:hidden;background:var(--surface)}
.scen [data-layout="marginal"] figure img{width:100%;height:100%;object-fit:contain}
.scen [data-layout="marginal"] .sig-notes{display:flex;flex-direction:column;justify-content:space-around;gap:24px}
.scen [data-layout="marginal"] article{position:relative;border-top:1px solid var(--line);padding-top:20px}
.scen [data-layout="marginal"] h3{font-size:37px;margin:12px 0}
.scen [data-layout="marginal"] article p{font-size:28px;color:var(--muted);line-height:1.4}
.scen [data-layout="marginal"] svg{position:absolute;width:96px;height:20px;right:100%;top:-10px}
.scen [data-layout="marginal"] circle{fill:var(--accent)}
.scen [data-layout="marginal"] .sig-placeholder{display:grid;place-items:center;height:100%;color:var(--muted)}
.scen [data-layout="sats"]{grid-template-rows:auto 1fr auto}

  function toast(msg) {

    spk = G.open('', 'scen-talarvy', 'width=1100,height=720');
    if (!spk) { toast('Fönstret blockerades. Tillåt popup-fönster och tryck P igen.'); return; }
    const css = (document.getElementById('scen-engine-css') || {}).textContent || '';
    spk.document.open();
    spk.document.write(`<!doctype html><html lang="sv"><head><meta charset="utf-8"><title>Talarvy</title><style>${css}
body{margin:0;background:#0B1322;color:#E7EDF7;font:16px/1.5 system-ui,sans-serif;height:100vh;display:grid;grid-template:auto 1fr/3fr 2fr;gap:20px;padding:20px;box-sizing:border-box}
header{grid-column:1/-1;display:flex;gap:24px;align-items:baseline}#t{font-size:34px;font-weight:650;font-variant-numeric:tabular-nums}#pos{color:#8E9AB3}
.cur,.nx{min-height:0}.lab{color:#8E9AB3;font-size:13px;margin:0 0 6px}#notes{font-size:22px;white-space:pre-wrap;overflow:auto}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #26345A;background:#131E35;color:inherit;cursor:pointer}</style></head>
<body><header><span id="t">0:00</span><span id="pos"></span><button id="pv">←</button><button id="nx">→</button><button id="rs">Nollställ tid</button></header>
<div class="cur"><p class="lab">Nu</p><div id="c"></div><p class="lab" style="margin-top:14px">Anteckningar</p><div id="notes"></div></div><div class="nx"><p class="lab">Nästa</p><div id="n"></div></div></body></html>`);

    c.innerHTML = ''; n.innerHTML = '';

    const nx = deck.slides[cur + 1]; if (nx) n.appendChild(imp(thumb(nx, deck, images, cur + 1))); else n.textContent = 'Sista bilden';

  }
  function tickTimer() {

        e.preventDefault(); return;

      else if (k === 'Home') show(0, { dir: -1 });
      else if (k === 'End') show(slides.length - 1, { dir: 1 });
      else if (k === 'o' || k === 'O') overview();
      else if (k === 'n' || k === 'N') notes();
      else if (k === 'p' || k === 'P') speaker();
      else if (k === 'f' || k === 'F') full();
      else if (k === 'b' || k === 'B') black.classList.toggle('on');
      else if (k === 'r' || k === 'R') replay();
      else if (/^[0-9]$/.test(k) && slides[cur] && slides[cur].dataset.layout === 'poll') vote(slides[cur], k);
      else if (!opt.student && (k === 't' || k === 'T')) {
        const ids = Object.keys(THEMES); const now = themeOverride || (deck.theme && deck.theme.id) || 'scen';

    sc.addEventListener('click', e => {
      const a = e.target.closest('[data-a]');
      if (a) { const f = { overview: () => overview(), notes: () => notes(), full, help: () => help(), exit: () => opt.onExit && opt.onExit(cur) }[a.dataset.a]; f && f(); e.stopPropagation(); return; }
      if (e.target.closest('.sc-overview,.sc-notes,.sc-help')) return;
      if (e.target.closest('.sc-black')) { $('.sc-black').classList.remove('on'); return; }
      if (e.target.closest('a,button,input,select,textarea')) return;
      const pl = e.target.closest('.poll li');
      if (pl) { vote(slides[cur], '', pl); return; }
      const r = vp.getBoundingClientRect();

    });
    let sx = null, sy = null;
    vp.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') { sx = e.clientX; sy = e.clientY; sc.classList.add('touch'); } });

    sc.addEventListener('click', e => { if (sc._swiped && Date.now() - sc._swiped < 400) e.stopImmediatePropagation(); }, true);
    const wake = () => { sc.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => sc.classList.add('idle'), 2600); };
    sc.addEventListener('pointermove', wake); wake();
    timerIv = setInterval(tickTimer, 1000);
  }

  build(); fit();
  show(opt.start || 0, { anim: mode === 'present', atEnd: mode === 'preview' });
  if (mode === 'present' && opt.hint !== false) setTimeout(() => toast('→ eller klick går vidare · ? visar tangenter'), 600);

  return {
    el: sc,
    go(i, o) { show(i, Object.assign({ dir: i >= cur ? 1 : -1 }, o || {})); },

    }
  };
}
