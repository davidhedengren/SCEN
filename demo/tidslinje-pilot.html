<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SCEN – Tidslinjepilot</title>
  <link rel="stylesheet" href="../src/engine.css">
  <style>
    :root{color-scheme:dark;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:#080b12;color:#f5f7fb}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{display:grid;grid-template-rows:minmax(0,1fr) auto;background:#080b12}
    #preview{position:relative;min-height:0}
    .demo-bar{display:flex;align-items:center;gap:10px;min-height:64px;padding:10px 18px;border-top:1px solid #293040;background:#111620;color:#f5f7fb}
    .demo-bar button,.demo-bar select{font:600 14px/1.1 inherit;color:inherit;background:#1b2230;border:1px solid #384257;border-radius:9px;padding:10px 14px}
    .demo-bar button{cursor:pointer}
    .demo-bar button:hover{border-color:#7383a4}
    .demo-bar button:focus-visible,.demo-bar select:focus-visible{outline:2px solid #8da8ff;outline-offset:2px}
    .demo-bar label{display:flex;align-items:center;gap:8px;color:#bdc6d8;font-size:14px}
    .demo-bar input{accent-color:#8da8ff}
    .demo-state{margin-left:auto;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
    .demo-state b{font-size:14px}
    .demo-state span{color:#9eabc1;font:13px ui-monospace,"Cascadia Mono",monospace}
    .demo-help{color:#8793a8;font-size:13px;white-space:nowrap}
    @media(max-width:900px){.demo-help{display:none}.demo-state{margin-left:0}.demo-bar{flex-wrap:wrap}}
  </style>
</head>
<body>
  <main id="preview" aria-label="Interaktiv förhandsvisning av Tidslinje"></main>
  <nav class="demo-bar" aria-label="Demokontroller">
    <button id="prev" type="button">← Föregående</button>
    <button id="next" type="button">Nästa →</button>
    <button id="restart" type="button">Starta om</button>
    <label>Tema
      <select id="theme">
        <option value="scen">Scen</option>
        <option value="klassrum">Klassrum</option>
        <option value="atlas">Atlas</option>
        <option value="nattbana">Nattbana</option>
      </select>
    </label>
    <label>Exempel
      <select id="variant">
        <option value="4">4 punkter</option>
        <option value="6">6 punkter, lång text</option>
        <option value="2">2 punkter</option>
      </select>
    </label>
    <label><input id="motion" type="checkbox" checked> Rörelse</label>
    <span class="demo-help">Även ← → och klick i scenen fungerar.</span>
    <span class="demo-state"><b id="stateName">Översikt</b><span id="stateCode">overview · 0/5</span></span>
  </nav>
  <script src="../src/engine.js"></script>
  <script>
    const samples = {
      2: {
        title: 'Två avgörande skiften',
        text: 'En koncentrerad berättelse från utgångspunkt till nytt läge.',
        items: [
          '1950 | En idé formuleras | Den första principen blir möjlig att diskutera.',
          '2026 | Helheten återvänder | Sambandet kan nu läsas som en sammanhängande utveckling.'
        ]
      },
      4: {
        title: 'Från enskilda initiativ till gemensam riktning',
        text: 'Kontexten finns kvar medan fokus vandrar mellan de avgörande brytpunkterna.',
        items: [
          '1950 | Den första signalen | En idé får språk och börjar kunna delas.',
          '1997 | Ett nytt arbetssätt | Fler aktörer kan pröva principen i praktiken.',
          '2012 | Riktningen ändras | Sambanden blir viktigare än de enskilda delarna.',
          '2026 | Helheten blir synlig | Erfarenheterna kan läsas som en gemensam utveckling.'
        ]
      },
      6: {
        title: 'Sex brytpunkter i en lång förändringsprocess',
        text: 'Exemplet prövar hög täthet, längre formuleringar och fasta positioner genom hela fokussekvensen.',
        items: [
          '1980 | Ett lokalt försök tar form | En mindre grupp formulerar ett första arbetssätt och avgränsar vad som faktiskt ska förändras.',
          '1988 | Erfarenheterna börjar spridas | Resultaten blir tillräckligt tydliga för att andra miljöer ska kunna jämföra och pröva samma tanke.',
          '1996 | Gemensamma begrepp etableras | Diskussionen får ett stabilare språk som gör skillnader, mål och ansvar lättare att se.',
          '2004 | Systemet möter motstånd | Nya krav blottlägger konflikter mellan snabbhet, kvalitet och långsiktigt ansvar.',
          '2015 | Sambanden omprövas | Fokus flyttas från isolerade insatser till relationerna mellan människor, metoder och förutsättningar.',
          '2026 | En tydligare helhet framträder | Tidigare och framtida händelser kan förstås som delar av samma utvecklingslinje.'
        ]
      }
    };
    const root = document.getElementById('preview');
    const theme = document.getElementById('theme');
    const variant = document.getElementById('variant');
    const motion = document.getElementById('motion');
    const params = new URLSearchParams(location.search);
    if (params.has('theme')) theme.value = params.get('theme');
    if (params.has('variant')) variant.value = params.get('variant');
    if (params.get('motion') === 'none') motion.checked = false;
    const initialStep = Math.max(0, Number(params.get('step') || 0));
    let player;

    function deck() {
      const sample = samples[variant.value];
      return {
        title: 'Tidslinjepilot',
        theme: { id: theme.value },
        templates: {},
        slides: [{ id: 'tidslinje-pilot', layout: 'timeline', steps: true, ba: motion.checked ? 'auto' : 'none', ...sample }]
      };
    }
    function updateState() {
      const slide = player && player.el.querySelector('.slide.active');
      const state = slide?.dataset.dramaturgyState || 'overview';
      const focus = Number(slide?.dataset.dramaturgyFocus);
      const labels = { overview: 'Översikt', focus: `Fokus ${Number.isFinite(focus) ? focus + 1 : ''}`, restored: 'Återställd helhet' };
      document.getElementById('stateName').textContent = labels[state] || state;
      document.getElementById('stateCode').textContent = `${state}${state === 'focus' ? '-' + (focus + 1) : ''} · ${player.step()}/${player.steps()}`;
    }
    function after(action) { action(); requestAnimationFrame(() => requestAnimationFrame(updateState)); }
    function rebuild() {
      if (!player) player = Scen.player(root, deck(), { mode: 'present', hint: false });
      else player.setDeck(deck(), null, 0);
      player.replay(); updateState();
    }
    document.getElementById('prev').addEventListener('click', () => after(() => player.prev()));
    document.getElementById('next').addEventListener('click', () => after(() => player.next()));
    document.getElementById('restart').addEventListener('click', () => after(() => player.replay()));
    theme.addEventListener('change', rebuild);
    variant.addEventListener('change', rebuild);
    motion.addEventListener('change', rebuild);
    addEventListener('keydown', () => requestAnimationFrame(() => requestAnimationFrame(updateState)));
    root.addEventListener('click', () => requestAnimationFrame(() => requestAnimationFrame(updateState)));
    rebuild();
    if (initialStep) setTimeout(async () => {
      for (let i = 0; i < Math.min(initialStep, player.steps()); i++) {
        player.next();
        await new Promise(resolve => setTimeout(resolve, 720));
      }
      requestAnimationFrame(() => requestAnimationFrame(updateState));
    }, 900);
    else requestAnimationFrame(() => requestAnimationFrame(updateState));
  </script>
</body>
</html>
