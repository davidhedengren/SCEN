<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SCEN – Bildregi pilot</title>
  <link rel="stylesheet" href="../src/engine.css">
  <style>
    :root{color-scheme:dark;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:#080b12;color:#f5f7fb}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{display:grid;grid-template-rows:minmax(0,1fr) auto;background:#080b12}
    #preview{position:relative;min-height:0}
    .demo-bar{display:flex;align-items:center;gap:10px;min-height:66px;padding:10px 18px;border-top:1px solid #293040;background:#111620;color:#f5f7fb}
    .demo-bar button,.demo-bar select{font:600 14px/1.1 inherit;color:inherit;background:#1b2230;border:1px solid #384257;border-radius:9px;padding:10px 14px}
    .demo-bar button{cursor:pointer}.demo-bar button:hover{border-color:#7383a4}
    .demo-bar button:focus-visible,.demo-bar select:focus-visible{outline:2px solid #8da8ff;outline-offset:2px}
    .demo-bar label{display:flex;align-items:center;gap:8px;color:#bdc6d8;font-size:14px}.demo-bar input{accent-color:#8da8ff}
    .demo-state{margin-left:auto;display:flex;align-items:baseline;gap:8px;white-space:nowrap}.demo-state b{font-size:14px}.demo-state span{color:#9eabc1;font:13px ui-monospace,"Cascadia Mono",monospace}
    .demo-help{color:#8793a8;font-size:13px;white-space:nowrap}
    @media(max-width:1100px){.demo-help{display:none}.demo-state{margin-left:0}.demo-bar{flex-wrap:wrap}}
  </style>
</head>
<body>
  <main id="preview" aria-label="Interaktiv förhandsvisning av SCEN Bildregi"></main>
  <nav class="demo-bar" aria-label="Demokontroller">
    <button id="prev" type="button">← Föregående</button>
    <button id="next" type="button">Nästa →</button>
    <button id="restart" type="button">Starta om scen</button>
    <label>Scen
      <select id="scene">
        <option value="0">1 · Cinematic hero</option>
        <option value="1">2 · Helhet → detalj → helhet</option>
        <option value="2">3 · Spotlight / annotation</option>
        <option value="3">4 · Crop / mask reveal</option>
      </select>
    </label>
    <label>Tema
      <select id="theme"><option value="scen">Scen</option><option value="klassrum">Klassrum</option><option value="atlas">Atlas</option><option value="nattbana">Nattbana</option></select>
    </label>
    <label><input id="motion" type="checkbox" checked> Rörelse</label>
    <span class="demo-help">Använd även ← → eller klicka i scenen.</span>
    <span class="demo-state"><b id="stateName">Helhet</b><span id="stateCode">hero · 0/0</span></span>
  </nav>
  <script src="../src/engine.js"></script>
  <script>
    const baseSlides=[
      {id:'hero',layout:'bildregi',caption:'CINEMATIC HERO',title:'Rörelsen börjar i bilden',text:'Typografin använder lugnet i vänsterfältet medan kameran driver mot handlingen.',image:'img:../bilder/ai-agenter/ai10.jpg',alt:'Robot i ett geometriskt ljuslandskap',steps:true,imageDirection:{mode:'hero',crop:'cover',focus:[68,42],start:[47,50,1.04],end:[58,47,1.13],safe:[5,12,39,72],shade:[2,6,46,88,.62],direction:'right',speed:'slow'},imageBrief:{id:'hero-01',filename:'ai10.jpg',scene:'Cinematic hero',purpose:'Etablera en filmisk öppning där rörelsen i bilden bär tonen.',subject:'En robot i ett geometriskt ljuslandskap.',composition:'Motiv i höger tredjedel, lugn negativ yta till vänster.',placement:'höger tredjedel',aspectRatio:'16:9',avoid:'text över figurens ansikte; snabb eller dramatisk zoom',prompt:'Cinematic wide frame, humanoid robot moving through a luminous geometric environment, subject on the right third, calm negative space on the left for typography, subtle depth, restrained teal and warm light, professional editorial composition, no text.'}},
      {id:'detail',layout:'bildregi',caption:'HELHET → DETALJ → HELHET',title:'Strategin finns i relationerna',text:'Helheten etableras före varje precis förflyttning.',image:'img:../bilder/ai-agenter/ai04.jpg',alt:'Schackbräde i futuristiskt kontrollrum',steps:true,imageDirection:{mode:'detail',crop:'cover',focus:[50,50],start:[50,50,1],end:[50,50,1],safe:[5,9,36,34],shade:[2,4,42,43,.64],direction:'none',speed:'medium'},items:['centrum | Konfliktens centrum | 50 | 54 | 24 | 32 | Mittfältet visar var alternativen möts.','system | Systemets blick | 49 | 18 | 20 | 22 | Instrumentpanelen gör analysen till en del av miljön.']},
      {id:'spotlight',layout:'bildregi',caption:'SPOTLIGHT / ANNOTATION',title:'Skalan avslöjar systemet',text:'Bilden ligger kvar. Blicken flyttar sig mellan delar som behöver förklaras.',image:'img:../bilder/ai-agenter/ai07.jpg',alt:'Robotmodeller framför två stora robotar',steps:true,imageDirection:{mode:'spotlight',crop:'cover',focus:[50,50],start:[50,50,1],end:[50,50,1],safe:[4,5,42,32],shade:[1,1,48,42,.72],direction:'none',speed:'medium'},items:['modell | Den lilla modellen | 22 | 70 | 15 | 24 | En lokal enhet med begränsad räckvidd.','plattform | Den stora plattformen | 68 | 33 | 25 | 38 | Samma princip i en större operationell skala.']},
      {id:'reveal',layout:'bildregi',caption:'CROP / MASK REVEAL',title:'Staden byggs lager för lager',text:'Avslöjandet har betydelse: först rörelsen, sedan infrastrukturen, sist hela systemet.',image:'img:../bilder/ai-agenter/ai01.jpg',alt:'Futuristisk stadsgata med flygande fordon',steps:true,imageDirection:{mode:'reveal',crop:'cover',focus:[50,50],start:[50,50,1],end:[50,50,1],safe:[5,61,42,29],shade:[2,56,48,40,.66],direction:'none',speed:'medium'},items:['gata | Rörelsen | 0 | 0 | 34 | 100 | Flödet etableras först.','torn | Infrastrukturen | 33 | 0 | 34 | 100 | Strukturen ger rörelsen riktning.','stad | Systemet | 66 | 0 | 34 | 100 | Delarna binds till en helhet.']}
    ];
    const root=document.getElementById('preview'),scene=document.getElementById('scene'),theme=document.getElementById('theme'),motion=document.getElementById('motion');
    const paramText=location.search.slice(1)||location.hash.slice(1);const params=new URLSearchParams(paramText);if(params.has('scene'))scene.value=String(Math.max(0,Math.min(3,+params.get('scene'))));if(params.has('theme'))theme.value=params.get('theme');if(params.get('motion')==='none')motion.checked=false;const initialStep=Math.max(0,+params.get('step')||0);let player;
    function deck(){return{title:'SCEN Bildregi',theme:{id:theme.value},templates:{},slides:baseSlides.map(s=>({...s,ba:motion.checked?'auto':'none'}))}}
    function updateState(){if(!player)return;const active=player.index(),slide=player.el.querySelector('.slide.active'),state=slide?.dataset.dramaturgyState||'restored',focus=Number(slide?.dataset.dramaturgyFocus),mode=slide?.dataset.imageMode||'';scene.value=String(active);const labels={overview:'Helhet etablerad',focus:`Fokus ${Number.isFinite(focus)?focus+1:''}`,restored:mode==='hero'?'Kamerarörelse':'Helheten återvänder'};document.getElementById('stateName').textContent=labels[state]||state;document.getElementById('stateCode').textContent=`${mode} · ${state}${state==='focus'?'-'+(focus+1):''} · ${player.step()}/${player.steps()}`}
    function after(action){action();requestAnimationFrame(()=>requestAnimationFrame(updateState))}
    function rebuild(index=+scene.value){if(!player)player=Scen.player(root,deck(),{mode:'present',hint:false,onChange:updateState});else player.setDeck(deck(),null,index);player.go(index,{anim:false});player.replay();updateState()}
    document.getElementById('prev').addEventListener('click',()=>after(()=>player.prev()));document.getElementById('next').addEventListener('click',()=>after(()=>player.next()));document.getElementById('restart').addEventListener('click',()=>after(()=>player.replay()));scene.addEventListener('change',()=>rebuild(+scene.value));theme.addEventListener('change',()=>rebuild(player?player.index():+scene.value));motion.addEventListener('change',()=>rebuild(player?player.index():+scene.value));addEventListener('keydown',()=>requestAnimationFrame(()=>requestAnimationFrame(updateState)));root.addEventListener('click',()=>requestAnimationFrame(()=>requestAnimationFrame(updateState)));
    rebuild(+scene.value);if(initialStep)setTimeout(async()=>{for(let i=0;i<Math.min(initialStep,player.steps());i++){player.next();await new Promise(r=>setTimeout(r,700))}updateState()},900);
  </script>
</body>
</html>
